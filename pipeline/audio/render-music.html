<!doctype html><meta charset="utf-8"><title>render</title><body>rendering…
<script src="music-module.js"></script>
<script>
(async () => {
  const sr = 44100, bars = SONG.bars, barDur = 4 * 60 / SONG.bpm, secs = bars * barDur + 3;
  const oc = new OfflineAudioContext(2, Math.ceil(sr * secs), sr);
  const song = makeSong(oc, oc.destination); song.fade(1, 0.01);
  for (let b = 0; b < bars; b++) song.scheduleBar(b, 0.05 + b * barDur);
  const t0 = performance.now(); const buf = await oc.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const wav = new DataView(new ArrayBuffer(44 + n * 4)); const w = (o, s) => [...s].forEach((c, i) => wav.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); wav.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 2, true);
  wav.setUint32(24, sr, true); wav.setUint32(28, sr * 4, true); wav.setUint16(32, 4, true); wav.setUint16(34, 16, true); w(36, 'data'); wav.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { wav.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); wav.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  await fetch('/save', { method: 'POST', body: wav.buffer });
  document.title = 'done ' + Math.round(performance.now() - t0) + 'ms';
  document.body.textContent = document.title;
})().catch(e => { document.title = 'error ' + e; document.body.textContent = e.stack; });
</script>
